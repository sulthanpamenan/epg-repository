name: Auto Scrape Tivie ID

on:
  schedule:
    # Dijalankan otomatis tiap jam 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions di GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push results (jika ingin hasil JSON disimpan otomatis ke repo)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add output/schedule.json
          git commit -m "Update scraped schedule data [skip ci]" || echo "No changes to commit"
          git push
